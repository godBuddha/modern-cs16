      - ./server-data/cstrike/addons/amxmodx/configs/plugins.ini:/root/hlds/cstrike/addons/amxmodx/configs/plugins.ini:ro
      - ./server-data/cstrike/addons/amxmodx/configs/modules.ini:/root/hlds/cstrike/addons/amxmodx/configs/modules.ini:ro
      - ./server-data/cstrike/addons/amxmodx/plugins/cs16_bridge.amxx:/root/hlds/cstrike/addons/amxmodx/plugins/cs16_bridge.amxx:ro
      - ./server-data/cstrike/addons/amxmodx/modules/easy_http_amxx_i386.so:/root/hlds/cstrike/addons/amxmodx/modules/easy_http_amxx_i386.so:ro

  api:
    build:
      context: ./src/Api
    ports:
      - "7777:7777"
    depends_on:
      postgres-db:
        condition: service_healthy
    restart: unless-stopped
    environment:
      - DB_CONNECTION=${DB_CONNECTION}
      - JWT_SECRET=${JWT_SECRET}
      - RCON_PASSWORD=${RCON_PASSWORD}
      - API_PORT=7777
      - CS16_IMAGE=cs16vn/gameserver:latest
      - CS16_NETWORK=modern-cs16_default
      - CS16_PROJECT_DIR=/Volumes/PortableSSD/Congviec/modern-cs16
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  dashboard:
    build:
      context: ./src
      dockerfile: Dashboard/Dockerfile
    ports:
      - "7001:7001"
    depends_on:
      - api
    restart: unless-stopped
    environment:
      - DB_CONNECTION=${DB_CONNECTION}
      - API_URL=http://api:7777
      - PUBLIC_API_URL=http://localhost:7777
      - DASHBOARD_PORT=7001

  postgres-db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  nginx-fastdl:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./server-data/cstrike:/data/cstrike:ro
      - ./nginx-fastdl/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  pgdata: