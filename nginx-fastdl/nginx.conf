server {
    listen 80;
    server_name _;

    # FastDL root = thư mục cstrike
    # CS 1.6 client request: GET /maps/de_dust2.bsp, /models/..., /sprites/...
    root /data/cstrike;
    autoindex on;

    location / {
        default_type application/octet-stream;

        # Cache game assets aggressively
        expires 7d;
        add_header Cache-Control "public, max-age=604800";

        # Allow large BSP/MDL files (up to 200MB)
        client_max_body_size 0;
    }

    # Health check
    location /health {
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # Deny hidden files
    location ~ /\. {
        deny all;
    }
}
