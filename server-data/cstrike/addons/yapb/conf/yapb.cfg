// YAPB Configuration — Auto-Balance 5v5

// Bot quota: 10 tổng (5 mỗi bên)
yb_quota 10
yb_quota_match 1

// Auto kick bot khi human join cùng team
yb_auto_vacate 1

// Difficulty: 0=easy 1=normal 2=hard 3=expert
yb_difficulty 1

// Bots join cả khi không có người chơi
yb_join_delay_time 0
yb_join_team_order 0

// Bot names
yb_names_file "addons/yapb/conf/names.cfg"

// Frag/death tracking
yb_show_frag_log 0

// Navigation
yb_path_heuristic_mode 3
