// ── Modern CS 1.6 VN — Server Config ─────────────────────────────────────────
hostname "Modern CS 1.6 Vietnam"
rcon_password "Rcon_Cs16VN_2026!"
sv_password ""

// ── FastDL — Client tự download maps/models/sprites từ HTTP server ──────────
// Nginx đang chạy tại port 8080, serve thư mục server-data/cstrike
sv_downloadurl "http://10.211.55.2:8080"
sv_allowdownload 1
sv_allowupload 1

// ── Network ──────────────────────────────────────────────────────────────────
sv_lan 0
sv_region 4
// Rate settings — chuẩn ReHLDS 2024
sv_maxrate 100000
sv_minrate 25000
sv_maxupdaterate 102
sv_minupdaterate 60
sv_lan_rate 100000

// Unlag / hit registration
sv_unlag 1
sv_maxunlag 0.5
sv_unlagsamples 1
sv_unlagpush 0

// ReHLDS anti-flood (chống exploit)
sv_rehlds_movecmdrate_max_avg 400
sv_rehlds_movecmdrate_max_burst 2500
sv_rehlds_stringcmdrate_max_avg 80
sv_rehlds_stringcmdrate_max_burst 400

// ── Gameplay ─────────────────────────────────────────────────────────────────
mp_friendlyfire 0
mp_footsteps 1
mp_autoteambalance 1
mp_limitteams 0
mp_autokick 0
mp_freezetime 15
mp_roundtime 5
mp_buytime 0.5
mp_roundrestartdelay 5
mp_startmoney 800
mp_c4timer 35
mp_timelimit 0
mp_fraglimit 0
mp_maxrounds 0
mp_winlimit 0
mp_chattime 3
mp_forcechasecam 0

// ── Bunny Hop (BHop) ─────────────────────────────────────────────────────────
// sv_airaccelerate 100: cho phép tăng tốc trong không khí → bhop có thể thực hiện
// Mặc định của Valve là 10 (gần như khóa bhop hoàn toàn)
// Giá trị 100 = semi-bhop: cần kỹ thuật nhảy đúng timing (scroll wheel hoặc space)
sv_airaccelerate 100
// sv_maxspeed giữ nguyên 320 để không phá vỡ gameplay balance
sv_maxspeed 320

// ── Anti-cheat & cheats ───────────────────────────────────────────────────────
sv_cheats 0
sv_pure 0

// ── Bot settings (off for real players) ─────────────────────────────────────
bot_quota 0
bot_quota_mode "normal"
bot_difficulty 1

// ── Auth Lock Plugin (tắt để cho phép non-Steam clients kết nối tự do) ───────
// Đổi thành 1 nếu muốn yêu cầu đăng nhập qua Launcher
auth_lock_enabled 0

// ── Log ──────────────────────────────────────────────────────────────────────
log on
sv_logbans 1
sv_logecho 1
sv_logrelay 0
