<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"/>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 900px; height: 506px;
      overflow: hidden;
      background: #000;
    }

    /* Ảnh nền toàn màn splash */
    .splash-img {
      position: absolute;
      inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Lớp phủ nhẹ để text rõ hơn */
    .splash-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        120deg,
        rgba(0,0,0,0.15) 0%,
        rgba(0,0,0,0.05) 60%,
        rgba(0,0,0,0.2) 100%
      );
    }

    /* Version text — đặt đúng lên màn hình máy tính góc phải ảnh */
    /* Monitor nằm ở ~90% từ trái, ~41% từ trên                     */
    .version-overlay {
      position: absolute;
      top: 40%;
      right: 4.5%;
      width: 90px;
      text-align: center;
      color: #00ff88;
      font-family: 'Courier New', 'Lucida Console', monospace;
      font-size: 10px;
      font-weight: bold;
      line-height: 1.5;
      text-shadow: 0 0 10px #00ff88, 0 0 20px #00cc66;
      letter-spacing: 1px;
      /* glow nhẹ giống CRT monitor */
      filter: drop-shadow(0 0 4px #00ff88);
      animation: glow 1.5s ease-in-out infinite alternate;
    }

    @keyframes glow {
      from { text-shadow: 0 0 6px #00ff88, 0 0 12px #00cc66; }
      to   { text-shadow: 0 0 12px #00ff88, 0 0 24px #00ff99; }
    }

    /* Loading bar dưới cùng */
    .loading-bar {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 3px;
      background: rgba(255,255,255,0.08);
    }
    .loading-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #c8a84b, #f0c040, #00ff88);
      animation: load 1.85s cubic-bezier(.4,0,.2,1) forwards;
    }
    @keyframes load { to { width: 100%; } }

    /* Branding nhỏ dưới trái */
    .splash-brand {
      position: absolute;
      bottom: 16px; left: 20px;
      font-family: 'Courier New', monospace;
      font-size: 10px;
      color: rgba(200,168,75,0.7);
      letter-spacing: 2px;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <!-- Ảnh splash -->
  <img class="splash-img" src="../assets/splash.png" alt="splash">
  <div class="splash-overlay"></div>

  <!-- Version overlay đúng vị trí màn hình máy tính trong ảnh -->
  <div class="version-overlay">
    SERVER<br>v1.0.0-beta
  </div>

  <!-- Branding nhỏ -->
  <div class="splash-brand">CS 1.6 VN Community Edition</div>

  <!-- Loading bar -->
  <div class="loading-bar">
    <div class="loading-fill"></div>
  </div>
</body>
</html>
